name: objtool-klp-tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: [gcc, clang]
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison bc libssl-dev libelf-dev clang llvm

      - name: Cache kernel build output
        uses: actions/cache@v3
        with:
          path: build-${{ matrix.toolchain }}
          key: kbuild-${{ runner.os }}-${{ matrix.toolchain }}-${{ github.sha }}
          restore-keys: |
            kbuild-${{ runner.os }}-${{ matrix.toolchain }}-

      - name: Build kernel
        run: |
          CC=${{ matrix.toolchain }} make O=build-${{ matrix.toolchain }} defconfig
          CC=${{ matrix.toolchain }} make O=build-${{ matrix.toolchain }} -j$(nproc)

      - name: Run objtool tests
        run: CC=${{ matrix.toolchain }} make -C tools/objtool tests -j$(nproc)
