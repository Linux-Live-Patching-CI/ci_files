name: kernel-build-test

# One toolchain's kernel: build it configured for livepatch, then boot it and
# run the livepatch selftests.
#
# A reusable workflow, called once per toolchain, rather than a build job and
# a test job in the caller.  There each would carry its own matrix, and a test
# job can only wait on the whole build matrix: every toolchain's tests would
# sit until the slowest build finished, and be skipped outright if any build
# failed.  Called per toolchain, each test job waits on its own build only.

on:
  workflow_call:
    inputs:
      toolchain:
        description: 'Toolchain to build with: gcc-<major> or clang-<major>'
        required: true
        type: string

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: tc
        uses: ./.github/actions/setup-toolchain
        with:
          name: ${{ inputs.toolchain }}

      - name: Cache kernel build output
        uses: actions/cache@v4
        with:
          path: build-${{ inputs.toolchain }}
          key: kbuild-${{ runner.os }}-${{ inputs.toolchain }}-${{ github.sha }}
          restore-keys: |
            kbuild-${{ runner.os }}-${{ inputs.toolchain }}-

      - name: Configure kernel
        run: |
          set -euo pipefail
          b=build-${{ inputs.toolchain }}
          args='${{ steps.tc.outputs.make_args }}'
          frags='tools/testing/selftests/livepatch/config ci/configs/livepatch.config'

          make O="$b" $args defconfig
          # -m: merge only.  Left to itself the script finishes with a "make
          # alldefconfig" of its own, without the toolchain argument, and
          # Kconfig would settle the compiler-dependent options against the
          # runner's default compiler.  olddefconfig does that step instead.
          scripts/kconfig/merge_config.sh -m -O "$b" "$b/.config" $frags
          make O="$b" $args olddefconfig

          # Kconfig drops an option whose dependencies are not met, and says
          # nothing.  That is what became of the selftests' CONFIG_LIVEPATCH=y
          # on plain defconfig: the kernel built, the tests then skipped, and
          # everything was green.  Hold the result to every line asked for.
          missing=$(grep -hE '^(CONFIG_[A-Za-z0-9_]+=|# CONFIG_[A-Za-z0-9_]+ is not set)' $frags |
                    sort -u | grep -vxF -f "$b/.config" || [ $? = 1 ])
          if [ -n "$missing" ]; then
            while read -r line; do
              opt=$(echo "$line" | grep -o 'CONFIG_[A-Za-z0-9_]*')
              got=$(grep -E "^($opt=|# $opt is not set)" "$b/.config" || echo 'nothing')
              echo "::error::config fragment asks for '$line', .config has $got"
            done <<< "$missing"
            exit 1
          fi

      - name: Build kernel
        run: |
          make O=build-${{ inputs.toolchain }} ${{ steps.tc.outputs.make_args }} -j"$(nproc)"

      - name: Check the kernel used the matrix compiler
        run: |
          want='${{ steps.tc.outputs.major }}'
          cfg=build-${{ inputs.toolchain }}/.config
          sed -n 's/^CONFIG_CC_VERSION_TEXT=//p' "$cfg"
          # CONFIG_{GCC,CLANG}_VERSION is major*10000 + minor*100 + patch, and
          # whichever compiler is not in use reports 0.
          got=$(sed -n 's/^CONFIG_\(GCC\|CLANG\)_VERSION=\([0-9]\+\)$/\2/p' "$cfg" |
                sort -rn | head -1)
          [ "$((got / 10000))" = "$want" ] ||
            { echo "::error::kernel built with major $((got / 10000)), expected $want"; exit 1; }

      # The test modules are out-of-tree modules; KDIR points them at this
      # build rather than at the runner's own kernel.  The toolchain argument
      # reaches them, and the selftests' one userspace helper, through make's
      # command-line variables.
      - name: Build livepatch selftests
        run: |
          b=build-${{ inputs.toolchain }}
          make O="$b" ${{ steps.tc.outputs.make_args }} KDIR="$PWD/$b" \
               TARGETS=livepatch -j"$(nproc)" kselftest-install

      # A tarball because upload-artifact does not keep file modes, and the
      # selftests are scripts run by path.
      - name: Pack the VM's inputs
        run: |
          set -eu
          b=build-${{ inputs.toolchain }}
          mkdir stage
          cp "$b/arch/x86/boot/bzImage" stage/
          cp "$b/.config" stage/config
          cp -a "$b/kselftest/kselftest_install" stage/kselftest
          tar --zstd -cf livepatch-selftests.tar.zst -C stage .

      - uses: actions/upload-artifact@v4
        with:
          name: livepatch-selftests-${{ inputs.toolchain }}
          path: livepatch-selftests.tar.zst
          retention-days: 7
          if-no-files-found: error
          compression-level: 0   # already zstd

      - name: Upload kernel config on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-config-${{ inputs.toolchain }}
          path: build-${{ inputs.toolchain }}/.config
          retention-days: 7
          if-no-files-found: ignore

  livepatch-selftests:
    name: livepatch selftests
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Only the CI files: the kernel and the tests come from the build.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            ci

      - uses: actions/download-artifact@v4
        with:
          name: livepatch-selftests-${{ inputs.toolchain }}

      - name: Unpack
        run: mkdir vm && tar --zstd -xf livepatch-selftests.tar.zst -C vm

      # The suite takes about a minute and a half, boot included.  This is
      # the backstop for a VM that stops responding; a hung test is cut off
      # sooner by the guest script's per-test cap, and named.
      - name: Run livepatch selftests
        timeout-minutes: 20
        uses: ./.github/actions/run-vmtest
        with:
          kernel: vm/bzImage
          command: ci/vmtest/run-livepatch-selftests.sh vm/kselftest

      # Written by the guest script into the workspace, which the VM shares.
      # The KTAP log is in the step output too, but interleaved with the
      # kernel console; these are the clean copies.
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: livepatch-selftests-logs-${{ inputs.toolchain }}
          path: |
            livepatch-selftests.log
            dmesg.txt
          retention-days: 7
          if-no-files-found: ignore
